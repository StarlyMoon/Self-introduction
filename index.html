<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>星月大魔王</title>

    <style>
        body {
            background-color: #00cbff;
            padding: 20px;
        }
        
        h1 {
            color: #ffd55e;
            text-align: center;
        }

        .avatar {
            background-color:#fff;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            
            margin: 0 auto;
        }
        
        .avatar-crop-result {
            width: 80px; /* 可依需求改成 200px 或 44px */
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            object-position: 50.28% 50.32%;
            transform: scale(1.065) rotate(0deg);
            transform-origin: center center;
        }
    </style>
</head>
<body>
    <div class="avatar">
        <img class="avatar-crop-result" src="頭像.png" alt="頭像">
    </div>
    <h1>米亭祐月</h1>
</body>
</html>
