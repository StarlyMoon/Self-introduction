<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>自我介紹</title>

    <style>
        html, body {
            min-height: 100%;
        }
        
        body {
            padding: 40px;
            background-color: #ffd55e;
        }
        
        h1 {
            color: yellow;
            text-align: center;
            animation: appear 1s ease-out 3s both;
        }

        p {
            color: yellow;
            font-size: 22px;
            animation: reveal 0.5s ease-out 4.5s both;
        }
        
        .avatar {
            background-color:#fff;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto;
            transform-origin: 40px 240px;
            animation: turn 2s 1s both;
        }
        
        .avatar-crop-result {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 50%;
            object-fit: cover;
        }
        
        @keyframes turn {
            0% {
                transform: rotate(0deg) scale(3) translateY(200px);
            }
            16.5% {
                transform: rotate(-15deg) scale(3.5) translateY(200px);
            }
            33% {
                transform: rotate(0deg) scale(3) translateY(200px);
            }
            100%{
                transform: rotate(0deg) scale(1.065) translateY(0px);
            }
        }
        
        @keyframes appear {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        
        @keyframes reveal {
            0% {
                clip-path: inset(0 0 100% 0);
            }
            100% {
                clip-path: inset(0 0 0 0);
            }
        }
    </style>
</head>
<body>
    <div class="avatar">
        <img class="avatar-crop-result" src="1790341390633.jpg" alt="頭像">
    </div>
    <h1>小菜車</h1>
    <p><b>
        哈囉大家好，我是小菜車！<br>
        歡迎來到我的網頁<br>
        我也算是用盡了畢生所學，<br>
        好不容易拗出了一個網頁。
    </b></p>
</body>
</html>
